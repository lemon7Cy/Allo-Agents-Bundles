version: allo.workspace.v1
agent: course-report-teaching-agent

metadata:
  title: 教学助手
  subtitle: 课程报告设计、指导与评价支持
  description: 面向课程报告教学场景，支持选题设计、材料整理、写作指导、报告评价和初终稿对比分析。
  icon: graduation-cap
  theme:
    accent: sky
    density: comfortable

layout:
  type: split
  left:
    width: 42
    panels:
      - workflow-overview
      - material-slots
      - six-dimension-rubric
      - evaluation-boundary
  right:
    width: 58
    panels:
      - chat
      - prompts
      - artifacts

panels:
  - id: workflow-overview
    type: overview
    title: 课程报告教学支持
    summary: 围绕选题设计、材料整理、写作指导和报告评价，为课程报告教学提供全过程支持。
    items:
      - 探索与选题：结合课程目标、学生兴趣、素材数据和文献线索形成个性化选题。
      - 撰写与修订：围绕“观点-证据-反思”结构组织报告提纲、段落和修改建议。
      - 评价与反思：基于六维评分模型和初终稿对比，识别有材料证据的可观察改进和剩余风险。
      - 教师在环：教学助手提供评价参考，不替代教师正式评分和最终判断。

  - id: material-slots
    type: file_slots
    title: 课程材料与报告
    description: 请在对话中上传课程要求、教学资料、评价标准、学生报告或相关数据。
    slots:
      - id: assignment-brief
        label: 课程任务书 / 作业要求
        description: 报告主题范围、课程目标、格式要求、提交规范和截止时间。
        accepts: [pdf, docx, md, txt]
        required: false
      - id: material-library
        label: 数据与过程材料
        description: 课程数据集、实验记录、案例材料、代码、图表和学生作业过程材料。
        accepts: [csv, xlsx, pdf, docx, md, txt, py, ipynb]
        multiple: true
      - id: corpus-library
        label: 教学与参考资料
        description: 教材、课程 PPT、教学大纲、学术文献、优秀报告样例和写作模板。
        accepts: [pdf, pptx, docx, md, txt]
        multiple: true
      - id: rubric-library
        label: 评价标准
        description: 评价量规、评分维度、格式规范、教师自定义标准和课程要求。
        accepts: [pdf, docx, md, txt]
      - id: initial-draft
        label: 初稿
        description: 用于诊断问题和做增量评价的第一版课程报告。
        accepts: [docx, md, txt, pdf]
      - id: final-draft
        label: 终稿
        description: 用于和初稿对比、生成成长证据链和反思建议的修改后版本。
        accepts: [docx, md, txt, pdf]

  - id: six-dimension-rubric
    type: table
    title: 六维评价模型
    description: 评价时必须结合材料证据，不足之处应标记为证据不足或待教师确认。
    columns:
      - id: dimension
        label: 维度
      - id: focus
        label: 评价关注点
      - id: evidence
        label: 证据来源
      - id: risk
        label: 常见风险
    rows:
      - dimension: 创新性
        focus: 选题是否有新意，是否避免同质化，是否形成个人理解。
        evidence: 选题说明、文献、数据探索记录。
        risk: 题目泛化、与课程目标弱相关。
      - dimension: 数据分析深度
        focus: 是否有合理分析方法、图表解释和结论支撑。
        evidence: 数据集、代码、图表、实验结果。
        risk: 只贴图不解释，结论无法复现。
      - dimension: 完整性
        focus: 报告结构是否完整，关键环节是否缺失。
        evidence: 任务书、提纲、报告文本。
        risk: 缺章节、缺方法、缺反思。
      - dimension: 文献引用
        focus: 是否正确引用、理解和使用文献。
        evidence: 文献材料、引用列表、综述段落。
        risk: 虚构引用、堆砌引用、引用不支撑观点。
      - dimension: 结论合理性
        focus: 结论是否由证据推出，是否回应问题。
        evidence: 观点-证据映射、数据分析结果。
        risk: 过度推断、结论与证据脱节。
      - dimension: 格式规范性
        focus: 是否符合课程模板、图表、引用、标题层级和表达规范。
        evidence: 报告模板、评价量规、终稿。
        risk: 格式混乱、图表或引用不规范。

  - id: evaluation-boundary
    type: markdown_panel
    title: 评价说明
    markdown: |
      - 教学助手聚焦材料整理、证据核对、修改建议和教学追问。
      - 评价结论必须基于课程材料、学生文本、数据、文献或评价量规。
      - 缺少证据时，应标记为“证据不足”或“待教师确认”。
      - 教学助手只提供评价参考，不替代教师正式评分。
      - 记录 AI 参与环节，评价聚焦材料中可观察的变化、证据和改进。

  - id: chat
    type: agent_chat
    title: 教学助手对话
    source:
      agent: self

  - id: prompts
    type: entry_prompts
    title: 常用任务
    description: 可从选题设计、材料整理、提纲指导、报告评价和初终稿对比等任务开始。
    source:
      prompts: capabilities.entry_prompts

  - id: artifacts
    type: artifact_list
    title: 评价文件
    description: 生成的选题方案、报告提纲、评价报告和初终稿对比结果会集中显示在这里。
    filters:
      kinds: [topic_plan, outline, draft_review, rubric_evaluation, draft_comparison, reflection]
