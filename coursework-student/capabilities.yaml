agent: coursework-student
display_name: 课程报告助手（学生端）
summary: 课程报告全流程助手——支持探索选题、文献导读、生成可编辑初稿、撰写修订和成果下载。

capabilities:
  - id: explore-and-topic
    type: workflow_step
    label: 探索与选题
    required: true
    role: workflow
    description: 探索学生上传的数据/资料、导读相关文献、挖掘兴趣点，收敛出有自主性、不趋同的选题。

  - id: write-and-revise
    type: workflow_step
    label: 撰写与修订
    required: true
    role: workflow
    description: 根据课题和材料生成可编辑初稿，提供分析方案和示例代码，并按质量维度完成修订与自查。

  - id: self-assess-and-reflect
    type: review
    label: 自评与反思
    required: false
    role: review
    description: 对照六维质量标准帮学生自查初稿，指出差距与提升点。

  - id: literature-review
    type: skill
    label: 文献导读
    required: false
    role: knowledge
    description: 围绕选题检索、筛选并导读文献，给出可核实的来源、核心观点和阅读重点。
  - id: kb-evidence-scaffold
    type: skill
    label: 明学知识库检索
    required: false
    role: knowledge
    description: 围绕电池、储能、SOC、SOH 等主题检索可核验的正文、图表和参考文献线索，生成阅读地图与证据清单。

  - id: mingxue-kb
    type: plugin
    label: 明学知识库服务
    required: false
    role: knowledge
    description: 连接明学知识库，为课程知识、文献和证据检索提供支持。

  - id: topic-mining
    type: skill
    label: 选题挖掘
    required: false
    role: ideation
    description: 从学生兴趣、数据与文献缺口中挖掘具有自主性和可行性的选题候选，并给出取舍依据。

  - id: report-writing
    type: skill
    label: 初稿生成与修订
    required: false
    role: writing
    description: 生成带证据边界和待补标记的可编辑初稿，并按六个质量维度检查、修订和完善文稿。
  - id: document-export
    type: skill
    label: PDF / Word 文档导出
    required: false
    role: delivery
    description: 当用户明确指定 PDF、Word 或 DOCX 时，将已完成的初稿、选题方案、文献导读或自查报告导出为真实文件。

policies:
  response_style: deliver_then_refine
  generate_editable_draft: true
  always_cite_sources: true
  orchestration_owner: agent_bundle

entry_prompts:
  - 我要写《XX 课程》的报告，但还没想好选题。这是课程要求/我感兴趣的方向，帮我挖几个有自主性、不趋同的选题候选。
  - 我有一个课程论文课题，请先生成一份可编辑的完整初稿，并提供可以直接下载的 Markdown 文件；缺少的数据和课程要求请在文中标成待补充。
  - 围绕「<我的选题>」帮我导读 5 篇关键文献，给出可核实来源、各自的核心观点和我该重点读的部分。
  - 这是我报告的初稿（已上传），请按六个质量维度指出问题、提升点和修改优先级。
  - 我这段数据分析卡住了，帮我理清该用什么方法、怎么验证，并给我能看懂的示例代码，别直接给结论。
  - 我已经写了第三章，帮我检查论点、证据和结构是否完整。
  - 请把完成后的课程论文初稿导出为可编辑的 Word 文档。
