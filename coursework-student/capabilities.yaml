agent: coursework-student
display_name: 课程报告助手（学生端）
summary: 课程报告全流程的认知伙伴——辅助探索选题、文献导读、撰写与修订，引导学生把思路、证据和表达做得更扎实。

capabilities:
  - id: explore-and-topic
    type: workflow_step
    label: 探索与选题
    required: true
    role: workflow
    description: 探索学生上传的数据/资料、导读相关文献、挖掘兴趣点，收敛出有自主性、不趋同的选题。

  - id: write-and-revise
    type: workflow_step
    label: 撰写与修订
    required: true
    role: workflow
    description: 就领域问题答疑、必要时给可运行的分析代码、按质量维度帮学生检查初稿并生成修改任务。

  - id: self-assess-and-reflect
    type: review
    label: 自评与反思
    required: false
    role: review
    description: 对照六维质量标准帮学生自查初稿，指出差距与提升点。

  - id: literature-review
    type: skill
    label: 文献导读
    required: false
    role: knowledge
    description: 围绕选题检索、筛选并导读文献，给出可核实的来源、核心观点和阅读重点。
  - id: kb-evidence-scaffold
    type: skill
    label: 明学知识库检索
    required: false
    role: knowledge
    description: 围绕电池、储能、SOC、SOH 等主题检索可核验的正文、图表和参考文献线索，生成阅读地图与证据清单。

  - id: mingxue-kb
    type: plugin
    label: 明学知识库服务
    required: false
    role: knowledge
    description: 连接明学知识库，为课程知识、文献和证据检索提供支持。

  - id: topic-mining
    type: skill
    label: 选题挖掘
    required: false
    role: ideation
    description: 从学生兴趣、数据与文献缺口中挖掘具有自主性和可行性的选题候选，并给出取舍依据。

  - id: report-writing
    type: skill
    label: 撰写与修订辅助
    required: false
    role: writing
    description: 通过提纲、分析思路、问题清单和表达建议支持写作，并按六个质量维度检查初稿、给出修改优先级。

policies:
  response_style: scaffold_not_ghostwrite
  never_ghostwrite_full_report: true
  always_cite_sources: true
  orchestration_owner: agent_bundle

entry_prompts:
  - 我要写《XX 课程》的报告，但还没想好选题。这是课程要求/我感兴趣的方向，帮我挖几个有自主性、不趋同的选题候选。
  - 围绕「<我的选题>」帮我导读 5 篇关键文献，给出可核实来源、各自的核心观点和我该重点读的部分。
  - 这是我报告的初稿（已上传），请按六个质量维度指出问题、提升点和修改优先级。
  - 我这段数据分析卡住了，帮我理清该用什么方法、怎么验证，并给我能看懂的示例代码，别直接给结论。
  - 我已经写了第三章，帮我检查论点、证据和结构是否完整。
