version: allo.workspace.v1
agent: coursework-student

metadata:
  title: 课程报告助手（学生端）
  subtitle: 从选题规划到报告完善的全过程支持
  description: 面向学生的课程报告工作台，支持资料分析、文献导读、选题规划、可编辑初稿生成、修订自查和成果下载。
  icon: book-open
  theme:
    accent: emerald
    density: comfortable

layout:
  type: split
  left:
    width: 42
    panels:
      - workflow-overview
      - my-materials
      - six-dimension-rubric
      - learning-boundary
  right:
    width: 58
    panels:
      - chat
      - prompts
      - artifacts

panels:
  - id: workflow-overview
    type: overview
    title: 课程报告支持流程
    summary: 围绕选题、资料、写作与自查，为课程报告的各个阶段提供清晰、可执行的支持。
    items:
      - 探索与选题：结合课程要求、已有资料和个人兴趣，形成具有可行性的选题方案。
      - 文献与资料：梳理关键文献、数据和课程材料，明确可核实的依据。
      - 撰写与修订：根据课题和已有材料生成可编辑初稿，补充分析思路、表达和必要的示例代码。
      - 自查与完善：从内容、证据、结构和格式等方面检查初稿并明确修改重点。

  - id: my-materials
    type: file_slots
    title: 我的材料
    description: 请在对话中上传课程要求、数据、参考文献或初稿，助手会结合材料提供针对性建议。
    slots:
      - id: assignment-brief
        label: 课程要求 / 作业说明
        description: 报告主题范围、课程目标、格式要求、提交规范和截止时间。
        accepts: [pdf, docx, md, txt]
        required: false
      - id: my-data
        label: 我的数据 / 资料
        description: 你要分析的数据集、实验记录、代码、图表等。
        accepts: [csv, xlsx, pdf, docx, md, txt, py, ipynb]
        multiple: true
      - id: references
        label: 参考文献
        description: 你找到的文献、教材章节、课程 PPT，用于导读和引用核实。
        accepts: [pdf, pptx, docx, md, txt]
        multiple: true
      - id: my-draft
        label: 我的初稿
        description: 写好的初稿，用于六维自查、定位问题、生成修改任务和自检步骤。
        accepts: [docx, md, txt, pdf]

  - id: six-dimension-rubric
    type: table
    title: 报告自查要点
    description: 从选题、分析、结构、引用、结论和格式六个方面检查报告，明确需要优先完善的内容。
    columns:
      - id: dimension
        label: 维度
      - id: focus
        label: 自查关注点
      - id: risk
        label: 常见问题
    rows:
      - dimension: 创新性
        focus: 选题、分析角度或方法是否体现独立思考，并避免同质化。
        risk: 选题过于宽泛，或沿用常见模板而缺少个人理解。
      - dimension: 数据分析深度
        focus: 是否开展对比、机制分析或验证，并对数据和图表作出解释。
        risk: 数据来源不清，或仅罗列结果而缺少分析。
      - dimension: 完整性
        focus: 问题—方法—结果—结论闭环是否完整。
        risk: 关键章节缺失，或各部分之间缺少衔接。
      - dimension: 文献引用
        focus: 引用是否规范、来源可核实、正文有角标、引文与列表闭环。
        risk: 缺少必要文献，或正文引用与参考文献列表不一致。
      - dimension: 结论合理性
        focus: 结论是否由证据推出、有没有标注边界。
        risk: 结论超出证据范围，或与数据和图表不一致。
      - dimension: 格式规范性
        focus: 结构/图表编号/公式/引用/排版是否规范。
        risk: 图表编号、公式、引用或排版不符合课程要求。

  - id: learning-boundary
    type: markdown_panel
    title: 使用建议
    markdown: |
      - 直接说明课程、课题和希望生成的成果，即可先得到可编辑版本。
      - 材料暂时不完整时，初稿会明确标出待补课程要求、数据、结果和来源。
      - 文献、数据和引用都以可核实来源为准，缺少信息时会明确标注。
      - 完成修订后，可以继续用六维标准复查论点、证据、结构和表达。

  - id: chat
    type: agent_chat
    title: 和报告助手对话
    source:
      agent: self

  - id: prompts
    type: entry_prompts
    title: 常用任务
    description: 可从选题规划、文献导读、写作支持和报告自查等任务开始。
    source:
      prompts: capabilities.entry_prompts

  - id: artifacts
    type: artifact_list
    title: 成果文件
    description: 生成的选题方案、文献导读、论文初稿、写作建议和自查报告会集中显示在这里，可直接预览或下载。
    filters:
      kinds: [topic_plan, outline, report_draft, draft_self_review, reflection]
